[project]
name = "voiceonly"
version = "0.1.0"
description = "VoiceOnly bake-off: offline speech extraction pipeline and model benchmark"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "soundfile>=0.12",
    "sounddevice>=0.5",
    "soundcard>=0.4.3",
]

[project.optional-dependencies]
# Each candidate model is an optional extra so one broken install never blocks the others.
demucs = ["torch", "torchaudio", "demucs>=4.0"]
# onnxruntime-gpu 1.23 targets CUDA 12, so it can reuse the CUDA 12.8 + cuDNN 9 DLLs
# that ship with the cu128 PyTorch wheel (CUDA 13 runtime wheels have no Windows build).
roformer = ["audio-separator[gpu]", "onnxruntime-gpu>=1.22,<1.24", "audioread>=3.0.1",
            "imageio-ffmpeg>=0.5"]
metrics = ["pystoi"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[project.scripts]
voiceonly = "voiceonly.cli:main"

[project.gui-scripts]
voiceonly-app = "voiceonly.app:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voiceonly"]

[tool.pytest.ini_options]
testpaths = ["tests"]
